[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exvectr-gs"
version = "0.1.0"
description = "ExVectr Starship ground station: records, visualises and replays vehicle data"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "pyserial>=3.5",
]

[project.optional-dependencies]
usb = ["pyusb>=1.2"]  # transport = "usb" (userspace CDC-ACM, docs/usb-transport.md); needs libusb-1.0 on the host
dev = [
    "pyusb>=1.2",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

voice = ["piper-tts"]  # only for tools/generate_voice_clips.py, not a runtime dependency

[project.scripts]
exgs = "exvectr_gs.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: drives a headless Chromium (slow, occasionally flaky under load); skip with -m \"not browser\""]
# exvectr_packets comes from the git submodule, never copied (docs/wire-profiles.md)
pythonpath = ["lib/ExVectrPackets/python"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
extend-exclude = ["docs", ".venv", "lib"]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
