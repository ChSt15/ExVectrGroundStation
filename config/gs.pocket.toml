# Bench config: the Router (Pocket module) and the vehicle on USB, no fake source. A bench copy of gs.example.toml.
# Example ground station config. Runs with the fake source (no hardware needed).
# Copy to ~/.config/exvectr-gs/gs.toml and edit.

[core]
# "exvectrnet-1": the real ExVectrNetwork wire format (docs/network-design.md section 4, docs/wire-profiles.md).
# "provisional-1": the old temporary profile, only for the legacy firmware. Fake sources need neither.
wire_profile = "exvectrnet-1"
# Preferred source per value when several are fresh: the vehicle's own USB (full rate, debug set) first,
# then the Router (radio set plus the Pocket's RC state and link statistics).
source_priority = ["usb", "link", "fake"]
stale_min_s = 0.5

[server]
bind = "0.0.0.0"
port = 8765
control_hosts = ["127.0.0.1", "::1"]          # who may take RC control (others are view-only)

[recorder]
directory = "~/exvectr-recordings"
raw_frames = "unknown"                         # only undecodable frames are kept
flush_interval_ms = 100
fsync_interval_ms = 1000

# Command stream (docs/radio.md): the ground station is the vehicle's only control source. Its command engine sends
# CMD_STATE at 25 Hz from the moment the core runs, the identical frame to EVERY connected source with
# rc_role = "control" (the Router over the air, the vehicle USB on the bench). Its input is the Pocket's switches
# (RC_STATE from the Router on USB, never on the air) or, with no Pocket, the GUI's virtual switches.
# rc_role = "mirror" makes a source receive-only (never sent to), "none" the same for sources that carry no commands.

# Peer 1: the vehicle on USB (ExVectrNetwork node 1, direct). Telemetry at the USB rates including the debug
# set (ports 0x90 and up). It receives the GS CMD_STATE too; the vehicle accepts it from node 0 over USB.
[[source]]
id = "usb"
kind = "vehicle_usb"
match = { vid = "16c0", pid = "0483" }         # Teensy USB serial; or device = "/dev/serial/by-id/..."
rc_role = "control"
enabled = true                                 # set true when the Teensy is on USB (or use tools/fake_vehicle_pty.py)

# Peer 2: the Router (the ExVectrLink Pocket module) on USB (node 2). It also forwards the vehicle's radio set (node 1), the
# ship radio node (node 3) and the Pocket's RC_STATE (handset origin, USB only), plus its own LINK_STATS. The GS
# sends CMD_STATE to it; the Router forwards only that (src 0, dst 1) over the air. Set rc_role = "mirror" for a
# receive-only Router (nothing is ever sent to it).
[[source]]
id = "link"
kind = "link_module"
match = { device = "/dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_1C:DB:D4:5B:C2:88-if00" }
baud = 921600
rc_role = "control"
enabled = true

[[source]]
id = "fake"
enabled = false
kind = "fake"
profile = "usb"                                # "usb" (full set) or "radio" (reduced set)
seed = 1
speed = 1.0                                    # simulated seconds per wall second
rc_role = "none"                              # "control" lets the command engine send CMD_STATE to it (test double: keeps it in received_cmd)
answer_requests = true                         # test double: answers REQUESTs with REQUEST_ACK (docs/requests.md)
answer_telecommands = true                     # test double: accepts the TEMPORARY legacy telecommands (docs/telecommands.md)
# request_status = 2                           # ACK status to answer with (0 DONE ... 4 FAILED); request_drop_first = 2 to test retries
# echo_rc = true                               # test only: echo the SA channel value as MissionState.mission_index (docs/testing.md)
# faults = [ { kind = "dropout", at = 10, duration = 2, types = ["Attitude"] } ]

# REQUESTS (docs/requests.md): the ONLY things the ground station sends besides the command state. A whitelist of one-shot
# actions the GUI "Requests" panel and `exgs request send` may send, each only after a deliberate confirmation (hold
# 1 s in the GUI; `--confirm ACTION` in the CLI). The ground station does not interpret an action: whether the
# vehicle accepts it (disarmed and on the ground) is the vehicle's decision, and the GUI shows the REQUEST_ACK
# status exactly as reported. target = ExVectrNetwork node id: 1 vehicle, 2 Router (Pocket module), 3 ship radio node.
# confirm = "hold" (default) or "danger" (a stronger confirmation: a modal in the GUI, an extra CLI flag).
[requests]
# Sources tried in this order, the first one that is connected and can reach the target is used (the vehicle's USB
# reaches node 1 only, the Router reaches 1 over the air, 2 and 3). Not set: vehicle_usb sources, then link_module
# sources, then fake sources, each in config order. No suitable connected source: the send is refused, never queued.
source_preference = ["usb", "link", "fake"]

[[requests.action]]
action = "CALIB_GYRO_START"
label = "Gyro calibration start"
group = "Calibration"
target = 1

[[requests.action]]
action = "CALIB_GYRO_STOP"
label = "Gyro calibration stop"
group = "Calibration"
target = 1

[[requests.action]]
action = "CALIB_ACCEL_START"
label = "Accelerometer calibration start"
group = "Calibration"
target = 1

[[requests.action]]
action = "CALIB_ACCEL_STOP"
label = "Accelerometer calibration stop"
group = "Calibration"
target = 1

[[requests.action]]
action = "CALIB_MAG_START"
label = "Magnetometer calibration start"
group = "Calibration"
target = 1

[[requests.action]]
action = "CALIB_MAG_STOP"
label = "Magnetometer calibration stop"
group = "Calibration"
target = 1

[[requests.action]]
action = "CALIB_APPLY"
label = "Apply calibration"
group = "Calibration"
target = 1

[[requests.action]]
action = "SAVE_CONFIG"
label = "Save configuration"
group = "Vehicle"
target = 1

[[requests.action]]
action = "ZERO_ESTIMATORS"
label = "Zero estimators"
group = "Vehicle"
target = 1
arg_f_min = 1.0                 # window in s; the vehicle clamps to 1..60 as well
arg_f_max = 60.0
arg_f_default = 10.0
arg_f_name = "window, s"

[[requests.action]]
action = "SET_STOP_ALTITUDE"
label = "Stop altitude"
group = "Vehicle settings"
target = 1
arg_f_min = 1.0                 # metres, at least 1; no real maximum (the whitelist needs a finite bound)
arg_f_max = 1000000.0
arg_f_default = 20.0
arg_f_name = "altitude, m"      # sent by the Vehicle settings control of the Commands panel (plain click); not shown in the Requests panel

[[requests.action]]
action = "SYSTEM_RESET"
label = "System reset"
group = "Vehicle"
target = 1

# Link modules. The module ALWAYS obeys this, in flight too (workspace docs/safety.md 2.5 exception): it stops the radio
# link and enters over-the-air firmware upload. Hence confirm = "danger".
[[requests.action]]
action = "LINK_UPLOAD_MODE"
label = "Router: firmware upload mode"
group = "Link modules"
target = 2
confirm = "danger"

[[requests.action]]
action = "LINK_UPLOAD_MODE"
label = "Ship radio node: firmware upload mode"
group = "Link modules"
target = 3
confirm = "danger"

# Reboot of a link module. LINK_REBOOT interrupts the radio link for seconds: a reboot of the ship radio node in
# flight interrupts RC for seconds.
[[requests.action]]
action = "LINK_REBOOT"
label = "Router: reboot"
group = "Link modules"
target = 2
confirm = "danger"
warning = "Reboots the Router: the radio link and the Pocket's RC stop for seconds."

[[requests.action]]
action = "LINK_REBOOT"
label = "Ship radio node: reboot"
group = "Link modules"
target = 3
confirm = "danger"
warning = "Reboots the ship radio node: RC to the vehicle is interrupted for seconds, in flight too. The module always obeys."

# TEMPORARY legacy TELECOMMANDS (docs/telecommands.md). A THIRD uplink, besides the command state and REQUESTs, approved by the
# user on 2026-11-20 and kept ONLY until the flight software's T9b replaces it by RC_STATE mapping and REQUESTs.
# TODO(T9b): delete this whole section, the `telecommand/` package, `exgs tc` and the GUI panel then.
# The vehicle takes the old 8-byte Telecommand on ExVectrNetwork port 0x7F (src node 0, dst node 1). Each command is
# sent EXACTLY ONCE per deliberate confirmation (GUI hold 1 s, CLI `exgs tc send NAME --confirm NAME`): no retry, no
# ACK, and the vehicle de-duplicates nothing. The GUI never shows an assumed simulation state:
# only VehicleStatus.simulation as reported. Control hosts only, never in replay, never to a source that is not
# connected, at most one per 500 ms per client. name = whitelist key, type = flight software TelecommandType,
# subsystem = flight software Subsystem (2 = magnetometer), param_int = int16 parameter (magic values are the
# vehicle's). T9b-4: the vehicle IGNORES the telecommands Arm, SimulationMode, MissionBegin, MissionSelect,
# MissionAbort and SystemReset (it counts and logs them), so they are NOT in this whitelist: safety commands are
# given with the virtual radio switches (config/radio.pocket.toml). Only the non-safety entries below remain.
[telecommands]
source_preference = ["usb", "link", "fake"]    # vehicle USB first, else the Router link

# ZeroEstimators and SetStopAltitude are REMOVED on the vehicle (it ignores and counts them): they are the
# ZERO_ESTIMATORS and SET_STOP_ALTITUDE requests now ([[requests.action]] above).

[[telecommands.command]]
name = "CalibGyroStart"
type = "CalibStart"
label = "Gyro: start calibration"
group = "Calibration"
subsystem = 0
param_int = 1
note = "vehicle must be disarmed, on the ground, not in simulation"

[[telecommands.command]]
name = "CalibGyroStop"
type = "CalibStart"
label = "Gyro: stop and fit"
group = "Calibration"
subsystem = 0
param_int = 0

[[telecommands.command]]
name = "CalibGyroVerify"
type = "CalibStart"
label = "Gyro: verify active calibration"
group = "Calibration"
subsystem = 0
param_int = 2

[[telecommands.command]]
name = "CalibGyroDiscard"
type = "CalibStart"
label = "Gyro: discard candidate"
group = "Calibration"
subsystem = 0
param_int = -1

[[telecommands.command]]
name = "CalibGyroApply"
type = "CalibApply"
