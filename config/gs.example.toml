label = "Save configuration"
group = "Vehicle"
target = 1

[[requests.action]]
action = "ZERO_ESTIMATORS"
label = "Zero estimators"
group = "Vehicle"
target = 1
arg_f_min = 1.0                 # window in s; the vehicle clamps to 1..60 as well
arg_f_max = 60.0
arg_f_default = 10.0
arg_f_name = "window, s"

[[requests.action]]
action = "SET_STOP_ALTITUDE"
label = "Stop altitude"
group = "Vehicle settings"
target = 1
arg_f_min = 1.0                 # metres, at least 1; no real maximum (the whitelist needs a finite bound)
arg_f_max = 1000000.0
arg_f_default = 20.0
arg_f_name = "altitude, m"      # sent by the Vehicle settings control of the Vehicle panel (plain click); not shown in the Requests panel

