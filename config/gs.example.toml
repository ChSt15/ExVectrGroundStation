# Simulation tests (vehicle: simulation mode only, else REJECTED_STATE 'not in simulation'). Shown on the Simulation testing page,
# not in the Requests panel (group "Simulation"); the page sends several in sequence, each after the previous ACK.
[[requests.action]]
action = "SIM_WIND_SPEED"
label = "Wind speed"
group = "Simulation"
target = 1
arg_f_min = 0.0
arg_f_max = 20.0
arg_f_default = 0.0
arg_f_name = "m/s"

[[requests.action]]
action = "SIM_WIND_DIRECTION"
label = "Wind direction"
group = "Simulation"
target = 1
arg_f_min = -3.141592653589793
arg_f_max = 3.141592653589793
arg_f_default = 0.0
arg_f_name = "rad, air moves toward, CCW from N toward W"

[[requests.action]]
action = "SIM_GUST_STRENGTH"
label = "Gust strength"
group = "Simulation"
target = 1
arg_f_min = 0.0
arg_f_max = 10.0
arg_f_default = 0.0
arg_f_name = "m/s"

[[requests.action]]
action = "SIM_GUST_PERIOD"
label = "Gust period"
group = "Simulation"
target = 1
arg_f_min = 0.5
arg_f_max = 30.0
arg_f_default = 5.0
arg_f_name = "s"

[[requests.action]]
action = "SIM_GUST_SEED"
label = "Gust seed"
group = "Simulation"
target = 1
arg_i = 1
arg_i_min = 0
arg_i_max = 16777215
arg_i_name = "seed"

[[requests.action]]
action = "SIM_FLAP_STUCK"
label = "Force flap"
group = "Simulation"
target = 1
arg_i = 0
arg_i_min = 0
arg_i_max = 3
arg_i_name = "flap 0..3 = TL TR BL BR"
arg_f_min = -1.0
arg_f_max = 1.5707963267948966
arg_f_default = 0.7
arg_f_name = "rad, -1 = hold the current angle"

[[requests.action]]
action = "SIM_FLAP_SLOW"
label = "Slow servo"
group = "Simulation"
target = 1
arg_i = 0
arg_i_min = 0
arg_i_max = 3
arg_i_name = "flap 0..3 = TL TR BL BR"
arg_f_min = 0.05
arg_f_max = 1.0
arg_f_default = 0.3
arg_f_name = "rate factor"

[[requests.action]]
action = "SIM_FAULT_CLEAR"
label = "Release all faults"
group = "Simulation"
target = 1

# Link modules. The module ALWAYS obeys this, in flight too (workspace docs/safety.md 2.5 exception): it stops the radio
# link and enters over-the-air firmware upload. Hence confirm = "danger".
[[requests.action]]
action = "LINK_UPLOAD_MODE"
label = "Router: firmware upload mode"
group = "Link modules"
target = 2
confirm = "danger"

[[requests.action]]
action = "LINK_UPLOAD_MODE"
label = "Ship radio node: firmware upload mode"
group = "Link modules"
target = 3
confirm = "danger"

# Reboot of a link module. LINK_REBOOT interrupts the radio link for seconds: a reboot of the ship radio node in
# flight interrupts RC for seconds.
[[requests.action]]
action = "LINK_REBOOT"
label = "Router: reboot"
group = "Link modules"
target = 2
confirm = "danger"
warning = "Reboots the Router: the radio link and the Pocket's RC stop for seconds."

[[requests.action]]
action = "LINK_REBOOT"
label = "Ship radio node: reboot"
group = "Link modules"
target = 3
confirm = "danger"
warning = "Reboots the ship radio node: RC to the vehicle is interrupted for seconds, in flight too. The module always obeys."

[radio]
config = "config/radio.pocket.toml"

[gui]
layout = "config/layout.default.json"
model = "config/model.placeholder.json"
callouts = "config/callouts.default.json"   # default callout settings (docs/callouts.md)

# Data-rate view (docs/gui.md): air capacity PER DIRECTION in payload bytes/s, for the utilisation bars only.
# Air profile v1 (docs/network-design.md) is time-division with a 1:1 split: 25 air packets/s in EACH direction
# (20 ms slots) of 253 payload bytes = about 6.1 kB/s, downlink and uplink at the same time (not shared).
[rates]
air_capacity_down_bytes_s = 6100
air_capacity_up_bytes_s = 6100
# air_capacity_bytes_s = 6100   # compatibility alias: sets the direction(s) not given above

# Self-update from git (docs/updating.md). The core follows `branch` of `remote` with fast-forward merges only;
# it refuses with local changes, a different branch, or while armed / recording / an RC lease is held.
[update]
enabled = true
branch = "master"
remote = "origin"
auto_check_interval_s = 0       # 0 = only when asked (button, `exgs update check`); otherwise at least 60
allow_switch = false            # true: also update when another branch is checked out (follows that branch)
