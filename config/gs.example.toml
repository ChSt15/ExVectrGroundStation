# Example ground station config. Runs with the fake source (no hardware needed).
# Copy to ~/.config/exvectr-gs/gs.toml and edit.

[core]
# "exvectrnet-1": the real ExVectrNetwork wire format (docs/network-design.md section 4, docs/wire-profiles.md).
# "provisional-1": the old temporary profile, only for the legacy firmware. Fake sources need neither.
wire_profile = "exvectrnet-1"
# Preferred source per value when several are fresh: the vehicle's own USB (full rate, debug set) first,
# then the TX module (radio set plus the Pocket's RC state and link statistics).
source_priority = ["usb", "link", "fake"]
stale_min_s = 0.5

[server]
bind = "0.0.0.0"
port = 8765
control_hosts = ["127.0.0.1", "::1"]          # who may take RC control (others are view-only)

[recorder]
directory = "~/exvectr-recordings"
raw_frames = "unknown"                         # only undecodable frames are kept
flush_interval_ms = 100
fsync_interval_ms = 1000

# RC sending (docs/radio.md): the ground station is a SLAVE while the Pocket's RC_STATE arrives (it only shows
# the Pocket's positions) and sends nothing until the user switches it to MASTER (GUI "Switch to master",
# `exgs rc acquire`). In master the RC state goes to EVERY connected source with rc_role = "control".
# rc_role = "mirror" makes a source receive-only (never sent to), "none" the same for sources that carry no RC.
# The rejection of ground-station RC_STATE is done by the receiving side (TX module, later the vehicle), never here.

# Peer 1: the vehicle on USB (ExVectrNetwork node 1, direct). Telemetry at the USB rates including the debug
# set (ports 0x90 and up). In master it receives the GS RC_STATE; the vehicle accepts it as the bench control
# source (node 0 over USB).
[[source]]
id = "usb"
kind = "vehicle_usb"
match = { vid = "16c0", pid = "0483" }         # Teensy USB serial; or device = "/dev/serial/by-id/..."
rc_role = "control"
enabled = false                                # set true when the Teensy is on USB (or use tools/fake_vehicle_pty.py)

# Peer 2: the ExVectrLink TX module on USB (node 2). It also forwards the vehicle's radio set (node 1), the
# vehicle RX module (node 3) and the Pocket's RC_STATE (handset origin), plus its own LINK_STATS. In master the
# GS sends RC_STATE to it too; the TX module always rejects it (it drops RC_STATE arriving from USB towards the
# air). Set rc_role = "mirror" for a receive-only link module (nothing is ever sent to it).
[[source]]
id = "link"
kind = "link_module"
match = { device = "/dev/serial/by-id/usb-Silicon_Labs_CP2102_XXXX-if00-port0" }
baud = 921600
rc_role = "control"
enabled = false

[[source]]
id = "fake"
kind = "fake"
profile = "usb"                                # "usb" (full set) or "radio" (reduced set)
seed = 1
speed = 1.0                                    # simulated seconds per wall second
rc_role = "none"                              # "control" lets the RC controller send to it (accepts and keeps GS RcState)
answer_requests = true                         # test double: answers REQUESTs with REQUEST_ACK (docs/requests.md)
# request_status = 2                           # ACK status to answer with (0 DONE ... 4 FAILED); request_drop_first = 2 to test retries
# echo_rc = true                               # test only: echo the SA channel value as MissionState.mission_index (docs/testing.md)
# faults = [ { kind = "dropout", at = 10, duration = 2, types = ["Attitude"] } ]

# REQUESTS (docs/requests.md): the ONLY things the ground station sends besides RC state. A whitelist of one-shot
# actions the GUI "Requests" panel and `exgs request send` may send, each only after a deliberate confirmation (hold
# 1 s in the GUI; `--confirm ACTION` in the CLI). The ground station does not interpret an action: whether the
# vehicle accepts it (disarmed and on the ground) is the vehicle's decision, and the GUI shows the REQUEST_ACK
# status exactly as reported. target = ExVectrNetwork node id: 1 vehicle, 2 TX module, 3 RX module.
# confirm = "hold" (default) or "danger" (a stronger confirmation: a modal in the GUI, an extra CLI flag).
[requests]
# Sources tried in this order, the first one that is connected and can reach the target is used (the vehicle's USB
# reaches node 1 only, a TX module reaches 1 over the air, 2 and 3). Not set: vehicle_usb sources, then link_module
# sources, then fake sources, each in config order. No suitable connected source: the send is refused, never queued.
source_preference = ["usb", "link", "fake"]

[[requests.action]]
action = "CALIB_GYRO_START"
label = "Gyro calibration start"
group = "Calibration"
target = 1

[[requests.action]]
action = "CALIB_GYRO_STOP"
label = "Gyro calibration stop"
group = "Calibration"
target = 1

[[requests.action]]
action = "CALIB_ACCEL_START"
label = "Accelerometer calibration start"
group = "Calibration"
target = 1

[[requests.action]]
action = "CALIB_ACCEL_STOP"
label = "Accelerometer calibration stop"
group = "Calibration"
target = 1

[[requests.action]]
action = "CALIB_MAG_START"
label = "Magnetometer calibration start"
group = "Calibration"
target = 1

[[requests.action]]
action = "CALIB_MAG_STOP"
label = "Magnetometer calibration stop"
group = "Calibration"
target = 1

[[requests.action]]
action = "CALIB_APPLY"
label = "Apply calibration"
group = "Calibration"
target = 1

[[requests.action]]
action = "SAVE_CONFIG"
label = "Save configuration"
group = "Vehicle"
target = 1

[[requests.action]]
action = "SYSTEM_RESET"
label = "System reset"
group = "Vehicle"
target = 1

# Link modules. The module ALWAYS obeys this, in flight too (workspace docs/safety.md 2.5 exception): it stops the radio
# link and enters over-the-air firmware upload. Hence confirm = "danger".
[[requests.action]]
action = "LINK_UPLOAD_MODE"
label = "TX module: firmware upload mode"
group = "Link modules"
target = 2
confirm = "danger"

[[requests.action]]
action = "LINK_UPLOAD_MODE"
label = "RX module: firmware upload mode"
group = "Link modules"
target = 3
confirm = "danger"

[radio]
config = "config/radio.pocket.toml"

[gui]
layout = "config/layout.default.json"
model = "config/model.placeholder.json"
