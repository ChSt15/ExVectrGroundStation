# Example ground station config. Runs with the fake source (no hardware needed).
# Copy to ~/.config/exvectr-gs/gs.toml and edit.

[core]
# "exvectrnet-1": the real ExVectrNetwork wire format (docs/network-design.md section 4, docs/wire-profiles.md).
# "provisional-1": the old temporary profile, only for the legacy firmware. Fake sources need neither.
wire_profile = "exvectrnet-1"
# Preferred source per value when several are fresh: the vehicle's own USB (full rate, debug set) first,
# then the Router (radio set plus the Pocket's RC state and link statistics).
source_priority = ["usb", "link", "fake"]
stale_min_s = 0.5

[server]
bind = "0.0.0.0"
port = 8765
control_hosts = ["127.0.0.1", "::1"]          # who may take RC control (others are view-only)

[recorder]
directory = "~/exvectr-recordings"
raw_frames = "unknown"                         # only undecodable frames are kept
flush_interval_ms = 100
fsync_interval_ms = 1000

# Command stream (docs/radio.md): the ground station is the vehicle's only control source. Its command engine sends
# CMD_STATE at 25 Hz from the moment the core runs, the identical frame to EVERY connected source with
# rc_role = "control" (the Router over the air, the vehicle USB on the bench). Its input is the Pocket's switches
# (RC_STATE from the Router on USB, never on the air) or, with no Pocket, the GUI's virtual switches.
# rc_role = "mirror" makes a source receive-only (never sent to), "none" the same for sources that carry no commands.

# Peer 1: the vehicle on USB (ExVectrNetwork node 1, direct). Telemetry at the USB rates including the debug
# set (ports 0x90 and up). It receives the GS CMD_STATE too; the vehicle accepts it from node 0 over USB.
[[source]]
id = "usb"
kind = "vehicle_usb"
match = { vid = "16c0", pid = "0483" }         # Teensy USB serial; or device = "/dev/serial/by-id/..."
rc_role = "control"
enabled = false                                # set true when the Teensy is on USB (or use tools/fake_vehicle_pty.py)
# transport = "serial"                         # default (pyserial, /dev/ttyACM*). "usb": userspace CDC-ACM with pyusb for hosts
#                                              # without the kernel cdc_acm driver (the Steam Frame); needs match vid and pid.
#                                              # "auto": serial if the tty exists, else usb. docs/usb-transport.md

# Peer 2: the Router (the ExVectrLink Pocket module) on USB (node 2). It also forwards the vehicle's radio set (node 1), the
# ship radio node (node 3) and the Pocket's RC_STATE (handset origin, USB only), plus its own LINK_STATS. The GS
# sends CMD_STATE to it; the Router forwards only that (src 0, dst 1) over the air. Set rc_role = "mirror" for a
# receive-only Router (nothing is ever sent to it).
[[source]]
id = "link"
kind = "link_module"
match = { device = "/dev/serial/by-id/usb-Silicon_Labs_CP2102_XXXX-if00-port0" }
baud = 921600
rc_role = "control"
enabled = false
# The Router on a host without cdc_acm (the Frame):  transport = "usb"  and  match = { vid = "303a", pid = "1001" }

[[source]]
id = "fake"
kind = "fake"
profile = "usb"                                # "usb" (full set) or "radio" (reduced set)
seed = 1
speed = 1.0                                    # simulated seconds per wall second
rc_role = "none"                              # "control" lets the command engine send CMD_STATE to it (test double: keeps it in received_cmd)
answer_requests = true                         # test double: answers REQUESTs with REQUEST_ACK (docs/requests.md)
# request_status = 2                           # ACK status to answer with (0 DONE ... 4 FAILED); request_drop_first = 2 to test retries
# echo_rc = true                               # test only: echo the SA channel value as MissionState.mission_index (docs/testing.md)
# faults = [ { kind = "dropout", at = 10, duration = 2, types = ["Attitude"] } ]

# REQUESTS (docs/requests.md): the ONLY things the ground station sends besides the command state. A whitelist of one-shot
# actions the GUI "Requests" panel and `exgs request send` may send, each only after a deliberate confirmation (hold
# 1 s in the GUI; `--confirm ACTION` in the CLI). The ground station does not interpret an action: whether the
# vehicle accepts it (disarmed and on the ground) is the vehicle's decision, and the GUI shows the REQUEST_ACK
# status exactly as reported. target = ExVectrNetwork node id: 1 vehicle, 2 Router (Pocket module), 3 ship radio node.
# confirm = "hold" (default) or "danger" (a stronger confirmation: a modal in the GUI, an extra CLI flag).
[requests]
# Automatic home request: when true (default) the GS sends one GET_HOME_POSITION to the vehicle at T-5 (mission time first
# seen in [-5, 0) s), at the first mission state when joining a running mission, and when the vehicle's home epoch changes,
# so the home is known before a flight. It needs the GET_HOME_POSITION row below, a connected source, and live data (never
# replay). The home is display data only (GNSS panel, Requests panel). Set false to send home requests by hand only.
auto_home = true
# Sources tried in this order, the first one that is connected and can reach the target is used (the vehicle's USB
# reaches node 1 only, the Router reaches 1 over the air, 2 and 3). Not set: vehicle_usb sources, then link_module
# sources, then fake sources, each in config order. No suitable connected source: the send is refused, never queued.
source_preference = ["usb", "link", "fake"]

# Calibration (vehicle: disarmed, on the ground, not in simulation; refusals say 'see the console'). CALIB_CONTROL: arg_i = subsystem * 10 + code.
# Several rows share an action: the fixed arg_i is part of a row's identity.
[[requests.action]]
action = "CALIB_CONTROL"
label = "Gyro: start calibration"
group = "Calibration"
target = 1
arg_i = 1

