# Virtual radio configuration (design 5.6): control ids, channel mapping, safe defaults.
# Used by the core (RcController) and the GUI (radio widget). This file is a CONFIG, never code:
# the vehicle firmware owns the real channel -> function mapping (system-architecture.md "Switch
# mapping") and it may change. The `meaning` texts are informational labels only; the ground
# station has no logic attached to them and knows nothing about the Starship's commands.
#
# Safe defaults: every switch at its lowest/off position (index 0), the slider at 0.0, sticks neutral
# (1500 us), throttle channel low (1000 us). They are applied on every core start and whenever a
# control lease ends. Nothing is persisted.
#
# `lock = true` on a control makes it a guarded control: it is held at its default and can only be set
# to another value after an explicit unlock (rc.unlock), for at most `lock_timeout_s` (default 60 s).
# Relocking, a lease end, a control-source drop and every acquire return it to its default. This is a
# generic guard against accidents; the ground station does not know what the control means.

name = "Radiomaster Pocket"
send_rate_hz = 25
channel_count = 16
channel_default_us = 1500           # sticks (channels 1, 2, 4) and any unmapped channel: neutral
channel_defaults = { 3 = 1000 }     # 1-based channel -> us: throttle low
mapping_note = "Must match the flight-software compiled-in RC channel table (rev: not yet versioned)"

[[controls]]
id = "SA"
label = "SA"
meaning = "mission go"
kind = "toggle2"
channel = 5
values_us = [1000, 2000]
default = 0
svg = { x = 28, y = 40 }

[[controls]]
id = "SB"
label = "SB"
meaning = "mission type 0/1/2"
kind = "switch3"
channel = 6
values_us = [1000, 1500, 2000]
default = 0
svg = { x = 64, y = 40 }

[[controls]]
id = "SC"
label = "SC"
meaning = "vehicle mode: 0 simulation, 1 flight, 2 reserved"
kind = "switch3"
channel = 7
values_us = [1000, 1500, 2000]
default = 0
svg = { x = 100, y = 40 }

[[controls]]
id = "SD"
label = "SD"
meaning = "motor enable"
kind = "toggle2"
channel = 8
values_us = [1000, 2000]
default = 0
lock = true               # deliberate-action guard: cannot leave its default until unlocked (hold the padlock 1 s)
lock_timeout_s = 60       # an unlock lapses after this; the control then returns to its default (off)
svg = { x = 136, y = 40 }

[[controls]]
id = "SE"
label = "SE"
meaning = "reset hold"
kind = "momentary"
channel = 9
values_us = [1000, 2000]
default = 0
svg = { x = 172, y = 40 }

[[controls]]
id = "S1"
label = "S1"
meaning = "unassigned"
kind = "slider"
channel = 10
range_us = [1000, 2000]
default = 0.0
svg = { x = 100, y = 78 }
