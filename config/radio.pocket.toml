# Virtual radio configuration (design 5.6): control ids, channel mapping, safe defaults.
# Used by the core (RcController) and the GUI (radio widget). This file is a CONFIG, never code:
# the vehicle firmware owns the real channel -> function mapping (system-architecture.md "Switch
# mapping") and it may change. The `meaning` texts are informational labels only; the ground
# station has no logic attached to them and knows nothing about the Starship's commands.
#
# Safe defaults: every switch at its lowest/off position (index 0), the slider at 0.0, sticks neutral
# (1500 us), throttle channel low (1000 us). They are applied on every core start and whenever a
# control lease ends. Nothing is persisted.
#
# `lock = true` on a control makes it a guarded control: it is held at its default and can only be set
# to another value after an explicit unlock (rc.unlock), for at most `lock_timeout_s` (default 60 s).
# Relocking, a lease end, a control-source drop and every acquire return it to its default. This is a
# generic guard against accidents; the ground station does not know what the control means.

name = "Radiomaster Pocket"
send_rate_hz = 25
channel_count = 16
channel_default_us = 1500           # sticks (channels 1, 2, 4) and any unmapped channel: neutral
channel_defaults = { 3 = 1000 }     # 1-based channel -> us: throttle low
mapping_note = "Must match the flight-software compiled-in RC channel table, T9b-4 revision (ch5 SA, ch6 SB, ch7 SC, ch8 SD, ch9 SE, ch10 S1); the vehicle reports its own interpretation in RC_APPLIED"

# Stick DISPLAY only (radio panel and the compact RC panel of the Flight view): which channels the two gimbals
# show. The ground station sends no stick values: in master these channels carry the defaults above (sticks
# neutral 1500 us, throttle low 1000 us). 1-based channels; mode 2 = left stick yaw (x) / throttle (y), right
# stick roll (x) / pitch (y); mode 1 = left yaw / pitch, right roll / throttle. All keys optional (these defaults).
[sticks]
mode = 2
roll = 1
pitch = 2
throttle = 3
yaw = 4

[[controls]]
id = "SA"
label = "SA"
meaning = "up = go (needs an observed down-to-up change), down = abort / stop"
kind = "toggle2"
channel = 5
values_us = [1000, 2000]
default = 0
svg = { x = 28, y = 40 }

[[controls]]
id = "SB"
label = "SB"
meaning = "mission profile 0/1/2, read at go (only 2 flies)"
kind = "switch3"
channel = 6
values_us = [1000, 1500, 2000]
default = 0
svg = { x = 64, y = 40 }

[[controls]]
id = "SC"
label = "SC"
meaning = "simulation / real: changed only by an observed 0 <-> 1 edge on the ground, boots real; 2 reserved"
kind = "switch3"
channel = 7
values_us = [1000, 1500, 2000]
default = 0
svg = { x = 100, y = 40 }

[[controls]]
id = "SD"
label = "SD"
meaning = "motor interlock: toggle off, then on to open (needs a fresh state)"
kind = "toggle2"
channel = 8
values_us = [1000, 2000]
default = 0
lock = true               # deliberate-action guard: cannot leave its default until unlocked (hold the padlock 1 s)
lock_timeout_s = 60       # an unlock lapses after this; the control then returns to its default (off)
svg = { x = 136, y = 40 }

[[controls]]
id = "SE"
label = "SE"
meaning = "short press: reset system state / hold 1 s: zero estimators (while held)"
kind = "momentary"
channel = 9
values_us = [1000, 2000]
default = 0
svg = { x = 172, y = 40 }

[[controls]]
id = "S1"
label = "S1"
meaning = "unassigned"
kind = "slider"
channel = 10
range_us = [1000, 2000]
default = 0.0
svg = { x = 100, y = 78 }
