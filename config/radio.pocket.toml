# Virtual radio configuration (design 5.6): control ids, channel mapping, safe defaults of the VIRTUAL Pocket panel.
# Used by the virtual panel (RcController) and the GUI (radio widget). The command engine reads the real Pocket's
# switches on channels 5 to 9 (SA..SE) itself and turns the Pocket or this panel into the command state (CMD_STATE)
# it sends at 25 Hz: this file sends nothing. `send_rate_hz` is kept for compatibility and no longer used: the
# engine's rate is fixed at 25 Hz. The `meaning` texts are labels only.
#
# Safe defaults: every switch at its lowest/off position (index 0), the slider at 0.0, sticks neutral
# (1500 us), throttle channel low (1000 us). They are applied on every core start and whenever a
# panel lease ends (the engine then holds its last command state). Nothing is persisted.
#
# `lock = true` on a control makes it a guarded control: it is held at its default and can only be set
# to another value after an explicit unlock (rc.unlock, a deliberate hold in the GUI). Only arming is guarded: going
# back to the default (disarm) is always immediate. An unlock has NO timeout: it stays open until the user locks it
# again, or a reset event closes it (core start, SE system reset, failsafe request, lease end). Locking, those
# events and every acquire return it to its default (SD: motors disarmed). A panel that becomes the
# engine's input starts at the engine's output (SD at armed opens its guard). The ground station does not know what
# the control means.

name = "Radiomaster Pocket"
send_rate_hz = 25
channel_count = 16
channel_default_us = 1500           # sticks (channels 1, 2, 4) and any unmapped channel: neutral
channel_defaults = { 3 = 1000 }     # 1-based channel -> us: throttle low
mapping_note = "Pocket channels as the ground station's command engine reads them (ch5 SA, ch6 SB, ch7 SC, ch8 SD, ch9 SE; ch10 S1 unused): the engine turns them into CMD_STATE, the vehicle never sees the Pocket RC. The vehicle reports what it applied in CMD_APPLIED"

# Stick DISPLAY only (radio panel and the compact RC panel of the Flight view): which channels the two gimbals
# show. The ground station sends no stick values: in master these channels carry the defaults above (sticks
# neutral 1500 us, throttle low 1000 us). 1-based channels; mode 2 = left stick yaw (x) / throttle (y), right
# stick roll (x) / pitch (y); mode 1 = left yaw / pitch, right roll / throttle. All keys optional (these defaults).
[sticks]
mode = 2
roll = 1
pitch = 2
throttle = 3
yaw = 4

[[controls]]
id = "SA"
label = "SA"
meaning = "up = go (the vehicle needs an observed down-to-up change), down = abort / stop"
kind = "toggle2"
channel = 5
values_us = [1000, 2000]
default = 0
svg = { x = 28, y = 40 }

[[controls]]
id = "SB"
label = "SB"
meaning = "mission profile, read at go: 0 hover test, 1 waypoint test, 2 flight"
kind = "switch3"
channel = 6
values_us = [1000, 1500, 2000]
default = 0
svg = { x = 64, y = 40 }

[[controls]]
id = "SC"
label = "SC"
meaning = "vehicle mode: position 0 = real, 1 and 2 = simulation; the vehicle boots real and changes mode only on the ground, not committed"
kind = "switch3"
channel = 7
values_us = [1000, 1500, 2000]
default = 0
svg = { x = 100, y = 40 }

[[controls]]
id = "SD"
label = "SD"
meaning = "motors armed / disarmed: up = armed (needs an observed disarmed -> armed change, fresh command state)"
kind = "toggle2"
channel = 8
values_us = [1000, 2000]
default = 0
lock = true               # deliberate-action guard: cannot leave its default until unlocked (hold the padlock 1 s)
lock_timeout_s = 60       # accepted for old configs, IGNORED: no timer ever relocks or changes a control
svg = { x = 136, y = 40 }

[[controls]]
id = "SE"
label = "SE"
meaning = "short press: reset system state / hold 1 s: zero estimators (while held)"
kind = "momentary"
channel = 9
values_us = [1000, 2000]
default = 0
svg = { x = 172, y = 40 }

[[controls]]
id = "S1"
label = "S1"
meaning = "unassigned"
kind = "slider"
channel = 10
range_us = [1000, 2000]
default = 0.0
svg = { x = 100, y = 78 }
